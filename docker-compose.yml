services:

  web:
    build: .
    container_name: aplicacion-hola-mundo
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
      DB_NAME: holamundo
      DB_USER: appuser
      DB_PASSWORD: app12345
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: base-datos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root12345
      MYSQL_DATABASE: holamundo
      MYSQL_USER: appuser
      MYSQL_PASSWORD: app12345
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data: